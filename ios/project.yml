# XcodeGen spec: `xcodegen` turns this into Zemu.xcodeproj (not committed). See README.md.
name: Zemu
options:
  bundleIdPrefix: com.zemu
  deploymentTarget:
    iOS: "17.0"
    tvOS: "18.0"
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.5"
    CURRENT_PROJECT_VERSION: "1"
    OTHER_SWIFT_FLAGS: "-enable-upcoming-feature BareSlashRegexLiterals"
targets:
  # Stremio protocol, stream parsing/ranking, recommendations and persistence. No UI.
  ZemuCore:
    type: framework.static
    platform: auto
    supportedDestinations: [iOS, tvOS]
    sources: [Sources/ZemuCore]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.zemu.core
  Zemu:
    type: application
    platform: iOS
    sources:
      - Sources/Zemu
      - path: Resources
        excludes: [Info.plist, Assets.xcassets]
      - path: Resources/Assets.xcassets
    dependencies:
      - target: ZemuCore
      - package: MPVKit
        product: MPVKit
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Zemu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: Save Frame puts a still from the video in your Photos.
        # Community addons and some debrid links are plain HTTP.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Some addons and media servers run on your local network.
        # External players Zemu can hand a stream to.
        LSApplicationQueriesSchemes: [vlc-x-callback, infuse, outplayer]
        # stremio:// install links from addon websites, and zemu://details/{type}/{id} links.
        CFBundleURLTypes:
          - CFBundleURLName: Stremio addon
            CFBundleURLSchemes: [stremio]
          - CFBundleURLName: Zemu link
            CFBundleURLSchemes: [zemu]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zemu.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        CODE_SIGN_STYLE: Automatic
  # Apple TV: the same screens and player (`#if os(tvOS)` where the platform differs). See README.md.
  ZemuTV:
    type: application
    platform: tvOS
    sources:
      - Sources/Zemu
      - path: Resources/logo_mark.png
      - path: Resources/logo_wordmark.png
      - path: ResourcesTV/Assets.xcassets
    dependencies:
      - target: ZemuCore
      - package: MPVKit
        product: MPVKit
    info:
      path: ResourcesTV/Info.plist
      properties:
        CFBundleDisplayName: Zemu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities: [arm64]
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        # Community addons and some debrid links are plain HTTP.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Some addons and media servers run on your local network.
        LSApplicationQueriesSchemes: [vlc-x-callback, infuse, outplayer, youtube]
        CFBundleURLTypes:
          - CFBundleURLName: Stremio addon
            CFBundleURLSchemes: [stremio]
          - CFBundleURLName: Zemu link
            CFBundleURLSchemes: [zemu]
    settings:
      base:
        PRODUCT_NAME: Zemu
        PRODUCT_MODULE_NAME: Zemu
        PRODUCT_BUNDLE_IDENTIFIER: com.zemu.tvos
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        CODE_SIGN_STYLE: Automatic
